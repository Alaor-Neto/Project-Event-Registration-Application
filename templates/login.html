{% extends "base.html" %}
{% block titulo %}Login do organizador{% endblock %}
{% block conteudo %}
<div class="mb-5">
  <h2 class="h3">Área do organizador</h2>
  <h3 class="fs-6 fw-normal text-secondary m-0">Inicia sessão para ver os registos</h3>
</div>
{% if erro %}<div class="alert alert-danger" role="alert">{{ erro }}</div>{% endif %}
<form action="{{ url_for('login') }}" method="post">
  <div class="row gy-3 overflow-hidden">
    <div class="col-12">
      <div class="form-floating mb-3">
        <input type="email" class="form-control" name="email" id="email" placeholder="nome@exemplo.com" value="{{ email }}" required>
        <label for="email" class="form-label">Email</label>
      </div>
    </div>
    <div class="col-12">
      <div class="form-floating mb-3">
        <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
        <label for="password" class="form-label">Password</label>
      </div>
    </div>
    <div class="col-12">
      <div class="d-grid">
        <button class="btn bsb-btn-2xl btn-primary" type="submit">Entrar</button>
      </div>
    </div>
  </div>
</form>
<hr class="mt-5 mb-4 border-secondary-subtle">
<p class="m-0 text-secondary text-center"><a href="{{ url_for('inicio') }}" class="link-primary text-decoration-none">← Voltar ao evento</a></p>
{% endblock %}
