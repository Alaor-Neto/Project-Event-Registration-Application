<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ evento.nome }}{% endblock %}</title>
  <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/bs-brain@2.0.4/components/registrations/registration-6/assets/css/registration-6.css">
</head>
<body>
<section class="bg-primary p-3 p-md-4 p-xl-5 min-vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="{% block coluna %}col-12 col-md-9 col-lg-7 col-xl-6 col-xxl-5{% endblock %}">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-3 p-md-4 p-xl-5">
            {% block conteudo %}{% endblock %}
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
